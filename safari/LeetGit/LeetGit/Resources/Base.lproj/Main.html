<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
    <title>LeetGit for Safari</title>
</head>
<body>
    <img src="../Icon.png" width="80" height="80" alt="LeetGit">
    <h1>LeetGit for Safari</h1>
    <p class="state-unknown">Enable LeetGit in Safari Settings → Extensions.</p>
    <p class="state-on">LeetGit is enabled in Safari.</p>
    <p class="state-off">Enable LeetGit in Safari Settings → Extensions.</p>
    <button class="open-preferences">Open Safari Settings</button>
    <p>Use Safari 18 or later. Click LeetGit in Safari, allow access to LeetCode and the GitHub API, then connect your repository.</p>
    <button id="notifications">Enable failure notifications</button>
    <p id="status" role="status"></p>
</body>
</html>
